<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Check in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F8FA; --surface: #FFFFFF; --ink: #16213A; --muted: #5B6478;
      --line: #DADDE3; --present: #0E7C66; --alert: #C2412D;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10151F; --surface: #182031; --ink: #E8EBF1; --muted: #98A1B3;
        --line: #2B3447; --present: #3FC6A3; --alert: #F0795F;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 28px 24px; max-width: 420px; margin: 8vh auto 0;
    }
    .context { margin: 0; color: var(--muted); font-size: 15px; min-height: 1.5em; }
    h1 { font-size: 26px; line-height: 1.2; font-weight: 600; margin: 4px 0 24px; letter-spacing: -0.01em; }
    label { display: block; font-size: 15px; font-weight: 500; margin-bottom: 20px; }
    input {
      display: block; width: 100%; margin-top: 8px; padding: 13px 14px;
      font: inherit; font-size: 20px; letter-spacing: 0.02em;
      color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    }
    button { font: inherit; cursor: pointer; border-radius: 10px; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--present); outline-offset: 2px; }
    .primary {
      display: block; width: 100%; padding: 15px; border: 0;
      background: var(--ink); color: var(--surface); font-size: 17px; font-weight: 600;
    }
    .primary:disabled { opacity: 0.55; cursor: progress; }
    .quiet { background: none; border: 0; color: var(--muted); padding: 12px 0; text-decoration: underline; text-underline-offset: 3px; }
    .mark { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 16px; }
    .mark.ok { background: var(--present); }
    .mark.bad { background: var(--alert); }
    .detail { white-space: pre-line; color: var(--muted); margin: 0; }
    .error { color: var(--alert); margin: 0 0 16px; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <main class="panel">
    <p class="context" id="session"></p>

    <section id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Checking the code…</h1>
    </section>

    <section id="saved" hidden>
      <h1>Check in as <span id="savedId"></span></h1>
      <button class="primary" id="quick">Check in</button>
      <button class="quiet" id="notMe">Use a different ID</button>
    </section>

    <form id="form" hidden novalidate>
      <h1>Check in</h1>
      <p class="error" id="formError" hidden></p>
      <label for="sid">Student ID
        <input id="sid" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      </label>
      <button class="primary" id="submit">Check in</button>
    </form>

    <section id="result" hidden>
      <div class="mark" id="resultMark" aria-hidden="true"></div>
      <h1 id="resultTitle"></h1>
      <p class="detail" id="resultDetail"></p>
    </section>
  </main>

<script>
  const API = window.ATTENDANCE_API;
  const $ = id => document.getElementById(id);
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let claim = null, sessionTitle = '';
  const saved = store.get('attendance.studentId');

  // text/plain body = "simple" CORS request: no preflight, no Google cookies sent.
  async function call(payload) {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function deviceId() {
    let d = store.get('attendance.device');
    if (!d) {
      d = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Math.random().toString(36).slice(2) + Date.now().toString(36);
      store.set('attendance.device', d);
    }
    return d;
  }

  function showOnly(id) {
    ['loading', 'saved', 'form', 'result'].forEach(s => { $(s).hidden = s !== id; });
  }

  function showForm(error, value) {
    showOnly('form');
    $('formError').textContent = error || '';
    $('formError').hidden = !error;
    if (value != null) $('sid').value = value;
    $('sid').focus();
  }

  function showResult(r, id) {
    showOnly('result');
    $('resultMark').className = 'mark ' + (r.ok ? 'ok' : 'bad');
    $('resultMark').textContent = r.ok ? '✓' : '!';
    $('resultTitle').textContent = r.ok ? (r.already ? 'Already checked in' : 'Checked in')
      : (r.title || 'Check-in failed');
    $('resultDetail').textContent = r.ok ? `${r.name || id}\n${sessionTitle}` : r.reason;
  }

  function setBusy(busy) {
    ['quick', 'submit'].forEach(b => { $(b).disabled = busy; });
    $('quick').textContent = $('submit').textContent = busy ? 'Checking in…' : 'Check in';
  }

  async function submit(id) {
    id = (id || '').trim();
    if (!id) return showForm('Enter your student ID.');
    setBusy(true);
    try {
      const r = await call({ action: 'checkin', claim, studentId: id, deviceId: deviceId() });
      if (r.ok) { store.set('attendance.studentId', id); return showResult(r, id); }
      if (r.fatal) return showResult(r, id);
      showForm(r.reason, id);
    } catch (e) {
      showForm('No connection. Tap Check in again.', id);
    } finally {
      setBusy(false);
    }
  }

  async function init() {
    const token = new URLSearchParams(location.search).get('t');
    history.replaceState(null, '', location.pathname); // don't leave the code in history or share sheets
    if (!API) return showResult({ ok: false, title: 'Not set up', reason: 'config.js is missing the API URL.' });
    if (!token) return showResult({ ok: false, title: 'Scan the screen', reason: 'Scan the QR code on the screen to check in.' });
    try {
      const r = await call({ action: 'scan', t: token });
      if (!r.ok) return showResult(r);
      claim = r.claim;
      sessionTitle = r.sessionTitle;
      $('session').textContent = sessionTitle;
      if (saved) { $('savedId').textContent = saved; showOnly('saved'); }
      else showForm();
    } catch (e) {
      showResult({ ok: false, reason: 'No connection. Check your internet and scan the screen again.' });
    }
  }

  $('quick').onclick = () => submit(saved);
  $('notMe').onclick = () => showForm(null, '');
  $('form').onsubmit = e => { e.preventDefault(); submit($('sid').value); };
  init();
</script>
</body>
</html>
